
name: Ticket Intelligence CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Quality checks and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AI_Learning/ticket-intelligence

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: AI_Learning/ticket-intelligence/pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app config

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov=config --cov-report=term-missing

  docker-build-and-test:
    name: Build and test Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: AI_Learning/ticket-intelligence
          file: AI_Learning/ticket-intelligence/Dockerfile
          tags: ticket-intelligence:ci
          load: true
          push: false

      - name: Verify container default input
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/AI_Learning/ticket-intelligence/data:/app/data:ro" \
            ticket-intelligence:ci

      - name: Verify container CSV input
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/AI_Learning/ticket-intelligence/data:/app/data:ro" \
            ticket-intelligence:ci \
            --input /app/data/tickets.csv

  publish-image:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest

    needs:
      - quality-and-tests
      - docker-build-and-test

    # Publish only on pushes to main, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: AI_Learning/ticket-intelligence
          file: AI_Learning/ticket-intelligence/Dockerfile
          push: true
          tags: |
            ghcr.io/vicky71011/ticket-intelligence:latest
            ghcr.io/vicky71011/ticket-intelligence:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/vicky71011/AI-UPSKILLING
            org.opencontainers.image.revision=${{ github.sha }}
