
name: Ticket Intelligence CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AI_Learning/ticket-intelligence

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: AI_Learning/ticket-intelligence/pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app config

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov=config --cov-report=term-missing
